<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暗記カードアプリ</title>
  <meta name="theme-color" content="#2193b0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="暗記カード">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--p1:#2193b0;--p2:#6dd5ed;--s1:#11998e;--s2:#38ef7d;--bg:#e8f6f8;--card-bg:#ffffff;--title:#1a202c;--sub:#718096;--border:#e2e8f0;--badge-bg:#d4eef7;--badge-fg:#2193b0;--ul-border:#2193b0;--ul-hover:#d4eef7;}
    body.theme-ocean {--p1:#2193b0;--p2:#6dd5ed;--s1:#11998e;--s2:#38ef7d;--bg:#e8f6f8;--badge-bg:#d4eef7;--badge-fg:#2193b0;--ul-border:#2193b0;--ul-hover:#d4eef7;}
    body.theme-dark  {--p1:#a44dff;--p2:#4361ee;--s1:#ff6b6b;--s2:#feca57;--bg:#0f0e17;--card-bg:#1e1d2f;--title:#fffffe;--sub:#94a1b2;--border:#2a2a3e;--badge-bg:#1e1d2f;--badge-fg:#a44dff;--ul-border:#a44dff;--ul-hover:#1e1d2f;}
    body.theme-light {--p1:#343a40;--p2:#6c757d;--s1:#20c997;--s2:#12b886;--bg:#f8f9fa;--badge-bg:#e9ecef;--badge-fg:#343a40;--ul-border:#6c757d;--ul-hover:#e9ecef;}
    body.theme-ichigo{--p1:#c9184a;--p2:#ff4d6d;--s1:#ff85a1;--s2:#fbb1bd;--bg:#fff0f3;--badge-bg:#fde2e4;--badge-fg:#c9184a;--ul-border:#c9184a;--ul-hover:#fde2e4;}
    body.theme-matcha{--p1:#4f6f52;--p2:#739072;--s1:#a9c9a4;--s2:#d8efd3;--bg:#f0f4e3;--badge-bg:#d8efd3;--badge-fg:#4f6f52;--ul-border:#4f6f52;--ul-hover:#d8efd3;}
    body.theme-cotton{--p1:#ff6fa3;--p2:#9ed9ff;--s1:#c4b5fd;--s2:#f0abfc;--bg:#fff0f8;--badge-bg:#ffe4f2;--badge-fg:#d946a8;--ul-border:#ff6fa3;--ul-hover:#ffe4f2;}

    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 20px 40px;transition:background .4s;}
    .screen{display:none;width:100%;max-width:480px;flex-direction:column;align-items:center;}
    .screen.active{display:flex;}

    /* ── floating btn ── */
    .theme-btn{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;background:var(--card-bg);box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:22px;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}

    /* ── shared overlay / bottom panel ── */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;}
    .overlay.open{display:block;}
    .btm-panel{position:fixed;bottom:-100%;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card-bg);border-radius:24px 24px 0 0;padding:24px 24px 44px;z-index:300;transition:bottom .35s cubic-bezier(.32,.72,0,1);}
    .btm-panel.open{bottom:0;}
    .panel-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
    .panel-title{font-size:16px;font-weight:bold;color:var(--title);text-align:center;margin-bottom:18px;}

    /* ── theme panel ── */
    .t-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    .t-opt{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .t-swatch{width:52px;height:52px;border-radius:50%;border:3px solid transparent;transition:border-color .2s,transform .2s;}
    .t-opt.active .t-swatch{border-color:var(--title);transform:scale(1.1);}
    .t-name{font-size:11px;color:var(--sub);font-weight:bold;}

    /* ── auth panel ── */
    .auth-tabs{display:flex;background:var(--border);border-radius:10px;padding:3px;margin-bottom:20px;}
    .auth-tab{flex:1;padding:9px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;color:var(--sub);background:none;transition:all .2s;-webkit-tap-highlight-color:transparent;}
    .auth-tab.active{background:var(--card-bg);color:var(--title);box-shadow:0 1px 4px rgba(0,0,0,.1);}
    .auth-form{display:flex;flex-direction:column;gap:12px;}
    .auth-input{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-size:16px;color:var(--title);background:var(--card-bg);outline:none;font-family:inherit;transition:border-color .2s;}
    .auth-input:focus{border-color:var(--p1);}
    .auth-submit{padding:15px;background:linear-gradient(135deg,var(--p1),var(--p2));color:white;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .auth-submit:disabled{opacity:.5;cursor:not-allowed;}
    .auth-err{font-size:13px;color:#ef4444;min-height:18px;text-align:center;}
    .auth-hint{font-size:12px;color:var(--sub);text-align:center;line-height:1.6;}

    /* ── common header ── */
    .s-header{display:flex;align-items:center;width:100%;margin-bottom:20px;padding-top:4px;}
    .back-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 10px 4px 0;color:var(--p1);-webkit-tap-highlight-color:transparent;}
    .s-title{font-size:18px;font-weight:bold;color:var(--title);flex:1;}
    .s-action{background:none;border:none;font-size:14px;color:var(--p1);cursor:pointer;font-weight:bold;-webkit-tap-highlight-color:transparent;}

    /* ── home ── */
    .app-logo{font-size:28px;font-weight:bold;text-align:center;margin:48px 0 6px;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .app-sub{font-size:14px;color:var(--sub);text-align:center;margin-bottom:20px;}
    .user-bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card-bg);border-radius:12px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
    .user-name{font-size:14px;font-weight:bold;color:var(--title);}
    .user-logout{font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer;padding:4px 8px;-webkit-tap-highlight-color:transparent;}
    .sync-btn{width:100%;padding:12px;background:none;border:2px dashed var(--ul-border);border-radius:12px;color:var(--badge-fg);font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:14px;-webkit-tap-highlight-color:transparent;transition:background .2s;}
    .sync-btn:active{background:var(--ul-hover);}
    .add-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--p1),var(--p2));color:white;border:none;border-radius:16px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:20px;-webkit-tap-highlight-color:transparent;}
    .deck-list{width:100%;display:flex;flex-direction:column;gap:12px;}
    .deck-card{background:var(--card-bg);border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.07);display:flex;align-items:center;gap:12px;border-left:4px solid var(--p1);-webkit-tap-highlight-color:transparent;transition:opacity .15s;}
    .deck-card:active{opacity:.7;}
    .deck-info{flex:1;min-width:0;}
    .deck-name{font-size:16px;font-weight:bold;color:var(--title);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .deck-meta{font-size:12px;color:var(--sub);}
    .d-badge{display:inline-block;font-size:10px;font-weight:bold;padding:2px 7px;border-radius:8px;margin-left:6px;vertical-align:middle;}
    .b-ng{background:#fee2e2;color:#ef4444;} .b-new{background:var(--badge-bg);color:var(--badge-fg);} .b-ok{background:#d1fae5;color:#10b981;}
    .empty-state{text-align:center;color:var(--sub);padding:48px 20px;}
    .empty-icon{font-size:48px;margin-bottom:12px;}

    /* ── add ── */
    .upload-area{background:var(--card-bg);border:3px dashed var(--ul-border);border-radius:20px;padding:36px 28px;text-align:center;cursor:pointer;transition:all .25s;width:100%;margin-bottom:20px;}
    .upload-area:hover,.upload-area.dragover{background:var(--ul-hover);}
    .ul-icon{font-size:48px;margin-bottom:12px;}
    .ul-title{font-size:17px;font-weight:bold;color:var(--title);margin-bottom:6px;}
    .ul-sub{font-size:13px;color:var(--sub);margin-bottom:16px;}
    .ul-count{display:inline-block;background:var(--badge-bg);color:var(--badge-fg);border-radius:12px;padding:4px 14px;font-size:13px;font-weight:bold;margin-top:4px;}
    .ul-pick{background:linear-gradient(135deg,var(--p1),var(--p2));color:white;border:none;border-radius:10px;padding:10px 22px;font-size:14px;cursor:pointer;}
    .f-label{font-size:14px;font-weight:bold;color:var(--title);margin-bottom:8px;width:100%;}
    .f-input{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-size:16px;color:var(--title);background:var(--card-bg);outline:none;font-family:inherit;transition:border-color .2s;}
    .f-input:focus{border-color:var(--p1);}
    .save-btn{width:100%;padding:16px;margin-top:20px;background:linear-gradient(135deg,var(--p1),var(--p2));color:white;border:none;border-radius:16px;font-size:16px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .save-btn:disabled{opacity:.4;cursor:not-allowed;}
    .hint-box{margin-top:16px;padding:12px 14px;background:#fffbeb;border:1px solid #fbbf24;border-radius:10px;font-size:12px;color:#92400e;line-height:1.7;width:100%;}
    .hint-box strong{display:block;margin-bottom:2px;}

    /* ── detail ── */
    .stats-row{display:flex;gap:10px;width:100%;margin-bottom:14px;}
    .stat-box{flex:1;background:var(--card-bg);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
    .stat-n{font-size:26px;font-weight:bold;color:var(--title);}
    .stat-l{font-size:11px;color:var(--sub);margin-top:2px;}
    .stat-box.s-ok .stat-n{color:#10b981;} .stat-box.s-ng .stat-n{color:#ef4444;}
    .det-prog{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px;}
    .det-prog-fill{height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));border-radius:4px;transition:width .5s ease;}
    .order-seg{width:100%;margin-bottom:14px;}
    .order-seg-label{font-size:12px;color:var(--sub);font-weight:bold;margin-bottom:6px;}
    .order-seg-btns{display:flex;background:var(--border);border-radius:10px;padding:3px;}
    .order-seg-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;color:var(--sub);background:none;transition:all .2s;-webkit-tap-highlight-color:transparent;}
    .order-seg-btn.active{background:var(--card-bg);color:var(--title);box-shadow:0 1px 4px rgba(0,0,0,.1);}
    .study-btns{display:flex;flex-direction:column;gap:10px;width:100%;margin-bottom:18px;}
    .stbtn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s,transform .15s;}
    .stbtn:active{transform:scale(.97);opacity:.85;} .stbtn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
    .stbtn-all{background:linear-gradient(135deg,var(--p1),var(--p2));color:white;}
    .stbtn-ng{background:linear-gradient(135deg,var(--s1),var(--s2));color:white;}
    .ng-toggle{width:100%;padding:12px 16px;background:var(--card-bg);border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:bold;color:var(--title);cursor:pointer;display:flex;align-items:center;justify-content:space-between;-webkit-tap-highlight-color:transparent;}
    .ng-list{margin-top:8px;background:var(--card-bg);border-radius:12px;overflow:hidden;display:none;box-shadow:0 2px 8px rgba(0,0,0,.06);}
    .ng-list.open{display:block;}
    .ng-row{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);gap:8px;}
    .ng-row:last-child{border-bottom:none;}
    .ng-f{font-size:14px;font-weight:bold;color:var(--title);flex:1;}
    .ng-arr{font-size:11px;color:var(--sub);}
    .ng-b{font-size:13px;color:var(--sub);flex:1;text-align:right;}
    .info-box{text-align:center;padding:14px;color:var(--sub);font-size:14px;background:var(--card-bg);border-radius:12px;margin-bottom:16px;width:100%;}
    .del-btn{margin-top:20px;width:100%;padding:13px;background:none;border:2px solid #ef4444;border-radius:14px;color:#ef4444;font-size:15px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .del-btn:active{background:#fee2e2;}

    /* ── study ── */
    .round-badge{background:var(--badge-bg);color:var(--badge-fg);border-radius:20px;padding:4px 16px;font-size:13px;font-weight:bold;margin-bottom:14px;}
    .prog-wrap{width:100%;margin-bottom:18px;}
    .prog-info{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px;}
    .prog-bar{width:100%;height:7px;background:var(--border);border-radius:4px;overflow:hidden;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));border-radius:4px;transition:width .35s ease;}
    .card-wrap{width:100%;margin-bottom:22px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .card{width:100%;min-height:260px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 28px;box-shadow:0 8px 32px rgba(0,0,0,.15);background:linear-gradient(135deg,var(--p1),var(--p2));color:white;transition:background .3s ease;}
    .card.flipped{background:linear-gradient(135deg,var(--s1),var(--s2));}
    .c-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;opacity:.75;margin-bottom:14px;}
    .c-word{font-size:34px;font-weight:bold;text-align:center;line-height:1.35;word-break:break-word;transition:opacity .15s ease;}
    .c-word.fade{opacity:0;}
    .c-sub{font-size:16px;opacity:.75;margin-top:10px;text-align:center;word-break:break-word;}
    .c-sub.hidden{display:none;}
    .c-hint{margin-top:22px;font-size:12px;opacity:.65;}
    .ans-btns{display:flex;gap:14px;width:100%;}
    .ans-btns.hidden{visibility:hidden;}
    .btn-no,.btn-yes{flex:1;padding:16px 10px;border:none;border-radius:16px;font-size:16px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s,opacity .15s;-webkit-tap-highlight-color:transparent;}
    .btn-no{background:#ef4444;color:white;box-shadow:0 4px 14px rgba(239,68,68,.3);}
    .btn-yes{background:#10b981;color:white;box-shadow:0 4px 14px rgba(16,185,129,.3);}
    .btn-no:active,.btn-yes:active{transform:scale(.96);opacity:.85;}
    .btn-sub{font-size:11px;font-weight:normal;opacity:.85;}

    /* ── result ── */
    .res-card{background:var(--card-bg);border-radius:20px;padding:36px 28px;text-align:center;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.1);margin-bottom:20px;}
    .res-icon{font-size:64px;margin-bottom:14px;}
    .res-title{font-size:24px;font-weight:bold;color:var(--title);margin-bottom:8px;}
    .res-sub{font-size:14px;color:var(--sub);}
    .res-stats{display:flex;justify-content:center;gap:32px;margin-top:20px;}
    .rs-item{text-align:center;} .rs-num{font-size:36px;font-weight:bold;} .rs-label{font-size:12px;color:var(--sub);margin-top:2px;}
    .rs-ok .rs-num{color:#10b981;} .rs-ng .rs-num{color:#ef4444;}
    .res-actions{display:flex;flex-direction:column;gap:10px;width:100%;}
    .rbtn{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:bold;cursor:pointer;transition:opacity .2s,transform .15s;-webkit-tap-highlight-color:transparent;}
    .rbtn:active{transform:scale(.97);opacity:.85;} .rbtn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
    .rbtn-ng{background:linear-gradient(135deg,var(--p1),var(--p2));color:white;}
    .rbtn-all{background:linear-gradient(135deg,var(--s1),var(--s2));color:white;}
    .rbtn-back{background:var(--card-bg);color:var(--title);border:2px solid var(--border);}
  </style>
</head>
<body>

<button class="theme-btn" onclick="openTheme()">🎨</button>

<!-- Theme overlay + panel -->
<div class="overlay" id="t-ov" onclick="closeTheme()"></div>
<div class="btm-panel" id="t-panel">
  <div class="panel-handle"></div>
  <div class="panel-title">テーマを選択</div>
  <div class="t-opts">
    <button class="t-opt" data-theme="ocean"  onclick="setTheme('ocean')"> <span class="t-swatch" style="background:linear-gradient(135deg,#2193b0,#6dd5ed)"></span><span class="t-name">オーシャン</span></button>
    <button class="t-opt" data-theme="dark"   onclick="setTheme('dark')">  <span class="t-swatch" style="background:linear-gradient(135deg,#0f0e17,#4361ee)"></span><span class="t-name">ダーク</span></button>
    <button class="t-opt" data-theme="light"  onclick="setTheme('light')"> <span class="t-swatch" style="background:linear-gradient(135deg,#f8f9fa,#6c757d)"></span><span class="t-name">ライト</span></button>
    <button class="t-opt" data-theme="ichigo" onclick="setTheme('ichigo')"><span class="t-swatch" style="background:linear-gradient(135deg,#c9184a,#fbb1bd)"></span><span class="t-name">イチゴ</span></button>
    <button class="t-opt" data-theme="matcha" onclick="setTheme('matcha')"><span class="t-swatch" style="background:linear-gradient(135deg,#4f6f52,#d8efd3)"></span><span class="t-name">抹茶</span></button>
    <button class="t-opt" data-theme="cotton" onclick="setTheme('cotton')"><span class="t-swatch" style="background:linear-gradient(135deg,#ff6fa3,#9ed9ff)"></span><span class="t-name">わたあめ</span></button>
  </div>
</div>

<!-- Auth overlay + panel -->
<div class="overlay" id="auth-ov" onclick="closeAuth()"></div>
<div class="btm-panel" id="auth-panel">
  <div class="panel-handle"></div>
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">ログイン</button>
    <button class="auth-tab"        id="tab-reg"   onclick="switchTab('reg')">新規登録</button>
  </div>
  <div id="form-login" class="auth-form">
    <input class="auth-input" id="login-user" type="text"     placeholder="ユーザー名" autocomplete="username">
    <input class="auth-input" id="login-pass" type="password" placeholder="パスワード" autocomplete="current-password">
    <button class="auth-submit" id="login-btn" onclick="doLogin()">ログイン</button>
    <div class="auth-err" id="login-err"></div>
  </div>
  <div id="form-reg" class="auth-form" style="display:none">
    <input class="auth-input" id="reg-user" type="text"     placeholder="ユーザー名（英数字・_・- ／ 3〜20文字）" autocomplete="username">
    <input class="auth-input" id="reg-pass" type="password" placeholder="パスワード（6文字以上）" autocomplete="new-password">
    <button class="auth-submit" id="reg-btn" onclick="doRegister()">登録する</button>
    <div class="auth-err" id="reg-err"></div>
    <p class="auth-hint">登録するとデッキをクラウドに保存し<br>複数のデバイスで共有できます</p>
  </div>
</div>

<!-- ① Home -->
<div id="home-screen" class="screen active">
  <div class="app-logo">暗記カードアプリ</div>
  <p class="app-sub">Excelを読み込んで暗記しよう</p>
  <div id="user-area" style="width:100%"></div>
  <button class="add-btn" onclick="goAdd()">＋ 新しいデッキを追加</button>
  <div class="deck-list" id="deck-list"></div>
</div>

<!-- ② Add -->
<div id="add-screen" class="screen">
  <div class="s-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <span class="s-title">新しいデッキを追加</span>
  </div>
  <div class="upload-area" id="upload-area">
    <div class="ul-icon">📤</div>
    <div class="ul-title">Excelファイルをアップロード</div>
    <div class="ul-sub">タップ、またはドラッグ＆ドロップ</div>
    <button class="ul-pick" onclick="document.getElementById('file-input').click()">ファイルを選択</button>
    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none">
    <div class="ul-count" id="ul-count" style="display:none"></div>
  </div>
  <div style="width:100%;margin-bottom:4px">
    <div class="f-label">デッキ名</div>
    <input type="text" class="f-input" id="deck-name" placeholder="デッキ名を入力してください">
  </div>
  <button class="save-btn" id="save-btn" disabled onclick="saveDeck()">保存して開始</button>
  <div class="hint-box"><strong>Excelファイルの形式</strong>A列：表面（A1, A2…）　B列：裏面（B1, B2…）</div>
</div>

<!-- ③ Detail -->
<div id="detail-screen" class="screen">
  <div class="s-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <span class="s-title" id="det-hname"></span>
    <button class="s-action" onclick="editName()">編集</button>
  </div>
  <div id="det-body" style="width:100%"></div>
</div>

<!-- ④ Study -->
<div id="study-screen" class="screen">
  <div class="round-badge" id="round-badge">第1ラウンド</div>
  <div class="prog-wrap">
    <div class="prog-info"><span id="prog-text">1 / 10</span><span id="prog-pct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="card-wrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="c-label" id="c-label">おもて</div>
      <div class="c-word" id="c-word">—</div>
      <div class="c-sub hidden" id="c-sub">—</div>
      <div class="c-hint" id="c-hint">👆 タップして答えを確認</div>
    </div>
  </div>
  <div class="ans-btns hidden" id="ans-btns">
    <button class="btn-no"  onclick="judge(false)">✗ 未暗記<span class="btn-sub">もう一度やる</span></button>
    <button class="btn-yes" onclick="judge(true)">✓ 暗記済み<span class="btn-sub">次へ進む</span></button>
  </div>
</div>

<!-- ⑤ Result -->
<div id="result-screen" class="screen">
  <div class="res-card">
    <div class="res-icon"  id="res-icon">📖</div>
    <div class="res-title" id="res-title">ラウンド完了！</div>
    <div class="res-sub"   id="res-sub"></div>
    <div class="res-stats">
      <div class="rs-item rs-ok"><div class="rs-num" id="rs-ok">0</div><div class="rs-label">暗記済み ✓</div></div>
      <div class="rs-item rs-ng"><div class="rs-num" id="rs-ng">0</div><div class="rs-label">未暗記 ✗</div></div>
    </div>
  </div>
  <div class="res-actions">
    <button class="rbtn rbtn-ng"  id="rbtn-ng" onclick="retryNG()">未暗記を再挑戦 🔄</button>
    <button class="rbtn rbtn-all"              onclick="retryAll()">全単語をやり直す 🔄</button>
    <button class="rbtn rbtn-back"             onclick="goDetail(currentDeckId)">デッキに戻る ←</button>
  </div>
</div>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Firebase設定 — デバイス間同期を使う場合のみ入力

   手順:
   1. https://console.firebase.google.com でプロジェクト作成
   2. Authentication → ログイン方法 → メール/パスワード を有効化
   3. Firestore Database を作成
   4. プロジェクト設定 → ウェブアプリ → 設定値をコピーして下記に貼り付け

   Firestoreのセキュリティルール（推奨）:
     match /users/{uid} {
       allow read, write: if request.auth != null && request.auth.uid == uid;
     }
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const FB_CONFIG = {
  apiKey:            "",
  authDomain:        "",
  projectId:         "",
  storageBucket:     "",
  messagingSenderId: "",
  appId:             ""
};

/* ── Firebase init ── */
let auth = null, db = null, currentUser = null;
const FB_ON = !!(FB_CONFIG.apiKey);
if (FB_ON) {
  try {
    firebase.initializeApp(FB_CONFIG);
    auth = firebase.auth();
    db   = firebase.firestore();
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) onSignIn(user).catch(console.error);
      else { renderUserArea(); renderHome(); }
    });
  } catch(e) { console.error('Firebase init error:', e); }
}

/* ── Theme ── */
function applyTheme(t) {
  document.body.className = t ? 'theme-'+t : '';
  document.querySelectorAll('.t-opt').forEach(el => el.classList.toggle('active', el.dataset.theme === t));
  localStorage.setItem('tc-theme', t);
}
function setTheme(t) { applyTheme(t); closeTheme(); }
function openTheme()  { document.getElementById('t-ov').classList.add('open');    document.getElementById('t-panel').classList.add('open'); }
function closeTheme() { document.getElementById('t-ov').classList.remove('open'); document.getElementById('t-panel').classList.remove('open'); }
applyTheme(localStorage.getItem('tc-theme') || 'ocean');

/* ── Auth panel ── */
function openAuth() {
  if (!FB_ON) {
    alert('ログイン機能を使うにはFirebaseの設定が必要です。\nHTMLファイル内のFB_CONFIGに設定値を入力してください。');
    return;
  }
  switchTab('login');
  ['login-user','login-pass','reg-user','reg-pass'].forEach(id => document.getElementById(id).value = '');
  ['login-err','reg-err'].forEach(id => document.getElementById(id).textContent = '');
  document.getElementById('auth-ov').classList.add('open');
  document.getElementById('auth-panel').classList.add('open');
}
function closeAuth() {
  document.getElementById('auth-ov').classList.remove('open');
  document.getElementById('auth-panel').classList.remove('open');
}
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-reg').classList.toggle('active', !isLogin);
  document.getElementById('form-login').style.display = isLogin ? 'flex' : 'none';
  document.getElementById('form-reg').style.display   = isLogin ? 'none'  : 'flex';
}

function u2email(u) { return u.toLowerCase() + '@tangocho.app'; }
function email2u(e) { return e.replace('@tangocho.app', ''); }

async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('login-btn');
  if (!u || !p) { errEl.textContent = 'ユーザー名とパスワードを入力してください'; return; }
  btn.disabled = true; btn.textContent = '処理中...';
  try {
    await auth.signInWithEmailAndPassword(u2email(u), p);
    closeAuth();
  } catch(e) {
    errEl.textContent =
      ['auth/user-not-found','auth/wrong-password','auth/invalid-credential'].includes(e.code)
        ? 'ユーザー名またはパスワードが正しくありません'
        : e.code === 'auth/too-many-requests' ? 'しばらく時間をおいてからお試しください'
        : 'ログインに失敗しました';
  } finally { btn.disabled = false; btn.textContent = 'ログイン'; }
}

async function doRegister() {
  const u = document.getElementById('reg-user').value.trim();
  const p = document.getElementById('reg-pass').value;
  const errEl = document.getElementById('reg-err');
  const btn   = document.getElementById('reg-btn');
  if (!/^[a-zA-Z0-9_-]{3,20}$/.test(u)) { errEl.textContent = 'ユーザー名は半角英数字・_・- で3〜20文字'; return; }
  if (p.length < 6) { errEl.textContent = 'パスワードは6文字以上にしてください'; return; }
  btn.disabled = true; btn.textContent = '処理中...';
  try {
    await auth.createUserWithEmailAndPassword(u2email(u), p);
    closeAuth();
  } catch(e) {
    errEl.textContent = e.code === 'auth/email-already-in-use'
      ? 'このユーザー名は既に使われています'
      : 'アカウント作成に失敗しました';
  } finally { btn.disabled = false; btn.textContent = '登録する'; }
}

async function doLogout() {
  if (!confirm('ログアウトしますか？\nデッキのデータはクラウドに保存されています。')) return;
  await auth.signOut();
  deckCache = [];
  localStorage.removeItem(KEY);
  currentUser = null;
  renderUserArea();
  renderHome();
  showScreen('home-screen');
}

async function onSignIn(user) {
  let cloudDecks = null;
  try {
    const doc = await db.collection('users').doc(user.uid).get();
    if (doc.exists) cloudDecks = doc.data().decks || [];
  } catch(e) { console.error('Firestore load error:', e); }

  const local = loadLocalDecks();
  if (cloudDecks !== null && cloudDecks.length > 0) {
    deckCache = cloudDecks;
    localStorage.setItem(KEY, JSON.stringify(cloudDecks));
  } else if (local.length > 0) {
    deckCache = local;
    try { await db.collection('users').doc(user.uid).set({ decks: local }); } catch {}
  } else {
    deckCache = [];
  }
  renderUserArea();
  renderHome();
  showScreen('home-screen');
}

/* ── Storage ── */
const KEY = 'tc-decks';
let deckCache = null;

function loadLocalDecks() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } }
function loadDecks() { return deckCache !== null ? deckCache : loadLocalDecks(); }
async function saveDecks(d) {
  deckCache = d;
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {}
  if (db && currentUser) {
    try { await db.collection('users').doc(currentUser.uid).set({ decks: d }); }
    catch(e) { console.error('Firestore save error:', e); }
  }
}

/* ── Utils ── */
function uid()   { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function fmtDate(iso) { const d = new Date(iso); return `${d.getMonth()+1}月${d.getDate()}日`; }
function esc(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getOrder()  { return localStorage.getItem('tc-order') || 'rand'; }
function setOrder(o) { localStorage.setItem('tc-order', o); renderDetail(); }
function applyOrder(arr) { return getOrder() === 'seq' ? [...arr] : shuffle([...arr]); }
function shuffle(a)  { for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ── State ── */
let currentDeckId = null, currentMode = 'all';
let currentWords = [], memorized = [], notMemorized = [];
let idx = 0, round = 1, flipped = false, pendingWords = null;

/* ── Navigation ── */
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function goHome()    { renderHome(); showScreen('home-screen'); }
function goDetail(id){ currentDeckId = id; renderDetail(); showScreen('detail-screen'); }
function goAdd() {
  pendingWords = null;
  document.getElementById('file-input').value = '';
  document.getElementById('deck-name').value  = '';
  document.getElementById('save-btn').disabled = true;
  document.getElementById('ul-count').style.display = 'none';
  showScreen('add-screen');
}

/* ── User area ── */
function renderUserArea() {
  const el = document.getElementById('user-area');
  if (!FB_ON) { el.innerHTML = ''; return; }
  if (currentUser) {
    el.innerHTML = `<div class="user-bar"><span class="user-name">👤 ${esc(email2u(currentUser.email))} でログイン中</span><button class="user-logout" onclick="doLogout()">ログアウト</button></div>`;
  } else {
    el.innerHTML = `<button class="sync-btn" onclick="openAuth()">🔑 ログインしてデバイス間で同期</button>`;
  }
}

/* ── Home ── */
function renderHome() {
  const decks = loadDecks();
  const el = document.getElementById('deck-list');
  if (!decks.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div>デッキがまだありません<br>上のボタンから追加しよう</div></div>`;
    return;
  }
  el.innerHTML = decks.map(d => {
    const total = d.words.length, ng = d.notMemorizedIndices;
    const ngN = ng != null ? ng.length : null;
    const badge = ng == null ? `<span class="d-badge b-new">未学習</span>`
      : ngN === 0 ? `<span class="d-badge b-ok">全問暗記！</span>`
      : `<span class="d-badge b-ng">未暗記${ngN}語</span>`;
    const meta = [`全${total}語`, d.lastStudied ? `最終:${fmtDate(d.lastStudied)}` : ''].filter(Boolean).join(' · ');
    return `<div class="deck-card" onclick="goDetail('${d.id}')"><div class="deck-info"><div class="deck-name">${esc(d.name)}${badge}</div><div class="deck-meta">${meta}</div></div><div style="font-size:20px;color:var(--sub)">›</div></div>`;
  }).join('');
}

/* ── Detail ── */
function renderDetail() {
  const deck = loadDecks().find(d => d.id === currentDeckId);
  if (!deck) { goHome(); return; }
  document.getElementById('det-hname').textContent = deck.name;

  const total = deck.words.length, ng = deck.notMemorizedIndices;
  const never = ng == null, ngN = never ? 0 : ng.length, okN = never ? 0 : total - ngN;
  const pct = total > 0 ? Math.round(okN / total * 100) : 0;
  const order = getOrder();

  const statsHtml = `
    <div class="stats-row">
      <div class="stat-box"><div class="stat-n">${total}</div><div class="stat-l">全カード</div></div>
      <div class="stat-box s-ok"><div class="stat-n">${never?'—':okN}</div><div class="stat-l">暗記済み</div></div>
      <div class="stat-box s-ng"><div class="stat-n">${never?'—':ngN}</div><div class="stat-l">未暗記</div></div>
    </div>
    <div class="det-prog"><div class="det-prog-fill" style="width:${never?0:pct}%"></div></div>
    ${never ? '<div class="info-box">まだ学習していません</div>' : ''}`;

  const orderHtml = `
    <div class="order-seg">
      <div class="order-seg-label">出題順序</div>
      <div class="order-seg-btns">
        <button class="order-seg-btn ${order==='seq'?'active':''}" onclick="setOrder('seq')">順番通り</button>
        <button class="order-seg-btn ${order==='rand'?'active':''}" onclick="setOrder('rand')">ランダム</button>
      </div>
    </div>`;

  const ngDisabled = never || ngN === 0;
  const btnsHtml = `
    <div class="study-btns">
      <button class="stbtn stbtn-all" onclick="startStudy('all')">最初から始める (${total}語)</button>
      <button class="stbtn stbtn-ng" onclick="startStudy('ng')" ${ngDisabled?'disabled':''}>${never?'未暗記のみ (未学習)':`未暗記のみ (${ngN}語)`}</button>
    </div>`;

  let ngListHtml = '';
  if (!never && ngN > 0) {
    const rows = ng.map(i => deck.words[i]).map(w =>
      `<div class="ng-row"><span class="ng-f">${esc(w.front)}</span><span class="ng-arr">→</span><span class="ng-b">${esc(w.back)}</span></div>`
    ).join('');
    ngListHtml = `<div style="width:100%;margin-bottom:8px"><button class="ng-toggle" onclick="toggleNg(this)"><span>未暗記一覧 (${ngN}語)</span><span>▼</span></button><div class="ng-list" id="ng-list">${rows}</div></div>`;
  } else if (!never && ngN === 0) {
    ngListHtml = `<div class="info-box">🎉 全カード暗記済みです！</div>`;
  }

  document.getElementById('det-body').innerHTML =
    statsHtml + orderHtml + btnsHtml + ngListHtml +
    `<button class="del-btn" onclick="delDeck()">このデッキを削除</button>`;
}

function toggleNg(btn) { const l = document.getElementById('ng-list'); btn.querySelector('span:last-child').textContent = l.classList.toggle('open') ? '▲' : '▼'; }

function editName() {
  const decks = loadDecks(), deck = decks.find(d => d.id === currentDeckId);
  if (!deck) return;
  const v = prompt('デッキ名を変更', deck.name);
  if (v && v.trim()) { deck.name = v.trim(); saveDecks(decks); renderDetail(); }
}
function delDeck() {
  const deck = loadDecks().find(d => d.id === currentDeckId);
  if (!deck || !confirm(`「${deck.name}」を削除しますか？\nこの操作は取り消せません。`)) return;
  saveDecks(loadDecks().filter(d => d.id !== currentDeckId));
  goHome();
}

/* ── File loading ── */
document.getElementById('file-input').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
const ua = document.getElementById('upload-area');
ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('dragover'); });
ua.addEventListener('dragleave', () => ua.classList.remove('dragover'));
ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('dragover'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb   = XLSX.read(e.target.result, { type: 'array' });
      const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
      const words = [];
      for (const r of data) {
        if (r[0] != null && r[1] != null && String(r[0]).trim() && String(r[1]).trim())
          words.push({ front: String(r[0]).trim(), back: String(r[1]).trim() });
      }
      if (!words.length) { alert('有効なデータが見つかりませんでした。'); return; }
      pendingWords = words;
      const ni = document.getElementById('deck-name');
      if (!ni.value) ni.value = file.name.replace(/\.[^.]+$/, '');
      const uc = document.getElementById('ul-count');
      uc.textContent = `${words.length}語 読み込み済み`; uc.style.display = 'inline-block';
      document.getElementById('save-btn').disabled = false;
    } catch { alert('ファイルの読み込みに失敗しました。'); }
  };
  reader.readAsArrayBuffer(file);
}

function saveDeck() {
  if (!pendingWords) return;
  const name = document.getElementById('deck-name').value.trim() || '名前なしデッキ';
  const deck = { id: uid(), name, words: pendingWords, notMemorizedIndices: null, lastStudied: null };
  const decks = loadDecks(); decks.push(deck); saveDecks(decks);
  currentDeckId = deck.id; pendingWords = null;
  goDetail(deck.id);
}

/* ── Study ── */
function startStudy(mode) {
  const deck = loadDecks().find(d => d.id === currentDeckId); if (!deck) return;
  const words = mode === 'all'
    ? deck.words.map((w, i) => ({ ...w, di: i }))
    : (deck.notMemorizedIndices || []).map(i => ({ ...deck.words[i], di: i }));
  if (!words.length) return;
  currentMode = mode; currentWords = applyOrder(words);
  memorized = []; notMemorized = []; idx = 0; round = 1; flipped = false;
  document.getElementById('round-badge').textContent = '第1ラウンド';
  showScreen('study-screen'); renderCard();
}

function renderCard() {
  const w = currentWords[idx];
  const wEl = document.getElementById('c-word'), sEl = document.getElementById('c-sub');
  document.getElementById('card').classList.remove('flipped'); flipped = false;
  document.getElementById('ans-btns').classList.add('hidden');
  document.getElementById('c-label').textContent = 'おもて';
  document.getElementById('c-hint').textContent  = '👆 タップして答えを確認';
  sEl.classList.add('hidden');
  wEl.classList.add('fade');
  setTimeout(() => { wEl.textContent = w.front; wEl.classList.remove('fade'); }, 150);
  const done = memorized.length + notMemorized.length, total = currentWords.length;
  const pct = Math.round(done / total * 100);
  document.getElementById('prog-text').textContent = `${idx+1} / ${total}`;
  document.getElementById('prog-pct').textContent  = `${pct}%`;
  document.getElementById('prog-fill').style.width = `${pct}%`;
}

function flipCard() {
  if (flipped) return; flipped = true;
  const w = currentWords[idx], wEl = document.getElementById('c-word'), sEl = document.getElementById('c-sub');
  wEl.classList.add('fade');
  setTimeout(() => {
    document.getElementById('card').classList.add('flipped');
    document.getElementById('c-label').textContent = 'こたえ';
    document.getElementById('c-hint').textContent  = '下のボタンで判定してください';
    wEl.textContent = w.back; sEl.textContent = w.front;
    sEl.classList.remove('hidden'); wEl.classList.remove('fade');
    document.getElementById('ans-btns').classList.remove('hidden');
  }, 150);
}

function judge(ok) {
  (ok ? memorized : notMemorized).push(currentWords[idx]);
  idx++;
  if (idx >= currentWords.length) showResult(); else renderCard();
}

/* ── Save results ── */
function saveResults() {
  const decks = loadDecks(), deck = decks.find(d => d.id === currentDeckId); if (!deck) return;
  const ngSet = new Set(deck.notMemorizedIndices || []);
  memorized.forEach(w => ngSet.delete(w.di));
  notMemorized.forEach(w => ngSet.add(w.di));
  deck.notMemorizedIndices = [...ngSet].sort((a,b) => a-b);
  deck.lastStudied = new Date().toISOString();
  saveDecks(decks);
}

/* ── Result ── */
function showResult() {
  saveResults();
  document.getElementById('rs-ok').textContent = memorized.length;
  document.getElementById('rs-ng').textContent = notMemorized.length;
  const btn = document.getElementById('rbtn-ng');
  if (notMemorized.length === 0) {
    document.getElementById('res-icon').textContent  = '🏆';
    document.getElementById('res-title').textContent = '全問暗記達成！';
    document.getElementById('res-sub').textContent   = 'おめでとうございます！';
    btn.disabled = true;
  } else {
    document.getElementById('res-icon').textContent  = '📖';
    document.getElementById('res-title').textContent = `ラウンド${round}完了！`;
    document.getElementById('res-sub').textContent   = `未暗記 ${notMemorized.length} 語に再挑戦しよう！`;
    btn.disabled = false;
  }
  showScreen('result-screen');
}

function retryNG() {
  if (!notMemorized.length) return;
  round++;
  const words = [...notMemorized]; memorized = []; notMemorized = [];
  currentWords = applyOrder(words); idx = 0; flipped = false;
  document.getElementById('round-badge').textContent = `第${round}ラウンド`;
  showScreen('study-screen'); renderCard();
}
function retryAll() {
  const deck = loadDecks().find(d => d.id === currentDeckId); if (!deck) return;
  currentMode = 'all'; round = 1; memorized = []; notMemorized = [];
  currentWords = applyOrder(deck.words.map((w,i) => ({...w, di:i})));
  idx = 0; flipped = false;
  document.getElementById('round-badge').textContent = '第1ラウンド';
  showScreen('study-screen'); renderCard();
}

/* ── Service Worker ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* ── Init ── */
renderUserArea();
renderHome();
</script>
