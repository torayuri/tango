<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おえかきレター</title>
  <meta name="theme-color" content="#ff7a59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="おえかき">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root{
      --accent:#ff7a59; --accent-2:#ffb547; --bg:#fff7f0; --card:#ffffff;
      --ink:#2b2622; --sub:#8a7f77; --line:#f0e4da; --shadow:0 4px 18px rgba(80,40,20,.10);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
      background:var(--bg); color:var(--ink);
      display:flex; flex-direction:column; align-items:center;
      padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
      overscroll-behavior:none;
    }
    button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
    .screen{display:none;width:100%;max-width:520px;flex-direction:column;gap:12px;}
    .screen.active{display:flex;}

    /* header */
    .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .logo{font-size:20px;font-weight:800;letter-spacing:.02em;}
    .logo span{color:var(--accent);}
    .hdr-btns{display:flex;gap:8px;}
    .icon-btn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:20px;}
    .icon-btn:disabled{opacity:.35;}
    .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;}
    .badge.on{display:flex;}

    /* canvas */
    .board{position:relative;width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#fff;touch-action:none;}
    .board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}

    /* tools */
    .tools{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:12px;}
    .row{display:flex;align-items:center;gap:8px;}
    .row.between{justify-content:space-between;}
    .seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;}
    .seg button{padding:7px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);}
    .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
    .colors{display:flex;flex-wrap:wrap;gap:8px;}
    .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.08);position:relative;}
    .sw.on{outline:3px solid var(--accent);outline-offset:2px;}
    .sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden;}
    .sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
    .size-wrap{flex:1;display:flex;align-items:center;gap:10px;}
    .size-dot{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .size-dot i{display:block;border-radius:50%;background:var(--ink);}
    input[type=range]{flex:1;accent-color:var(--accent);}
    .label{font-size:12px;color:var(--sub);font-weight:600;min-width:28px;}
    .bg-sw{width:26px;height:26px;border-radius:8px;border:2px solid rgba(0,0,0,.1);}
    .bg-sw.on{outline:3px solid var(--accent);outline-offset:1px;}

    .primary{width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(255,122,89,.35);}
    .primary:disabled{opacity:.5;}
    .ghost{width:100%;padding:13px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:700;}
    .link{color:var(--sub);font-size:14px;padding:8px;text-decoration:underline;}

    /* send screen */
    .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;}
    .preview{width:100%;border-radius:14px;border:1px solid var(--line);display:block;}
    textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);outline:none;resize:none;}
    textarea:focus,input[type=text]:focus{border-color:var(--accent);}
    .h2{font-size:15px;font-weight:800;}
    .note{font-size:13px;color:var(--sub);line-height:1.6;}
    .err{font-size:13px;color:#d33;min-height:1em;}

    /* inbox */
    .list{display:flex;flex-direction:column;gap:12px;}
    .item{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
    .item img{width:100%;display:block;background:#fff;}
    .item .meta{padding:10px 14px;display:flex;flex-direction:column;gap:4px;}
    .item .from{font-weight:800;font-size:14px;}
    .item .from .new{background:#e5484d;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;}
    .item .msg{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
    .item .when{font-size:11px;color:var(--sub);}
    .item .acts{display:flex;gap:8px;padding:0 14px 12px;}
    .item .acts button{font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;background:var(--bg);}
    .empty{text-align:center;color:var(--sub);padding:48px 0;font-size:14px;}

    .modal-bg{display:none;position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:500;align-items:center;justify-content:center;padding:24px;}
    .modal-bg.on{display:flex;}
    .modal{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center;}
    .modal .big{font-size:42px;}
    .line-btn{width:100%;padding:14px;border-radius:14px;background:#06c755;color:#fff;font-size:16px;font-weight:800;}
    .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(30,25,20,.92);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90vw;text-align:center;}
    .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

<!-- ━━━━━━━━━━ お絵かき画面 ━━━━━━━━━━ -->
<section id="scr-draw" class="screen active">
  <div class="hdr">
    <div class="logo">おえかき<span>レター</span></div>
    <div class="hdr-btns">
      <button class="icon-btn" id="btn-undo" title="もとに戻す">↶</button>
      <button class="icon-btn" id="btn-redo" title="やり直す">↷</button>
      <button class="icon-btn" id="btn-inbox" title="受信箱">📬<span class="badge" id="inbox-badge"></span></button>
    </div>
  </div>

  <div class="board" id="board">
    <canvas id="cv-layer"></canvas>
  </div>

  <div class="tools">
    <div class="row between">
      <div class="seg" id="tool-seg">
        <button data-tool="pen" class="on">✏️ ペン</button>
        <button data-tool="eraser">🧽 消しゴム</button>
      </div>
      <button class="link" id="btn-clear">ぜんぶ消す</button>
    </div>
    <div class="colors" id="colors"></div>
    <div class="row">
      <div class="size-wrap">
        <div class="size-dot"><i id="size-dot"></i></div>
        <input type="range" id="size" min="2" max="60" value="8">
        <span class="label" id="size-label">8</span>
      </div>
    </div>
    <div class="row">
      <span class="label">背景</span>
      <div class="colors" id="bgs"></div>
    </div>
  </div>

  <button class="primary" id="btn-next">💌 この絵を送る</button>
</section>

<!-- ━━━━━━━━━━ 送信画面 ━━━━━━━━━━ -->
<section id="scr-send" class="screen">
  <div class="hdr">
    <button class="icon-btn" data-back="draw" title="戻る">←</button>
    <div class="logo">送る</div>
    <div style="width:42px"></div>
  </div>

  <div class="card">
    <img id="send-preview" class="preview" alt="送る絵">
    <textarea id="send-msg" rows="2" maxlength="140" placeholder="ひとことメッセージ（なくてもOK）"></textarea>
  </div>

  <div class="card" id="direct-card">
    <div class="h2">📮 アプリで届ける</div>
    <div id="direct-body"></div>
  </div>

  <div class="card">
    <div class="h2">📤 ほかのアプリで送る</div>
    <div class="note">LINE・メール・メッセージなどに画像として送れます。</div>
    <button class="ghost" id="btn-share">共有する</button>
    <button class="ghost" id="btn-save">画像を保存</button>
  </div>
</section>

<!-- ━━━━━━━━━━ 受信箱 ━━━━━━━━━━ -->
<section id="scr-inbox" class="screen">
  <div class="hdr">
    <button class="icon-btn" data-back="draw" title="戻る">←</button>
    <div class="logo">受信箱</div>
    <div style="width:42px"></div>
  </div>
  <div class="card" id="me-card"></div>
  <div class="list" id="inbox-list"></div>
</section>

<div class="modal-bg" id="sent-modal">
  <div class="modal">
    <div class="big">💌</div>
    <div class="h2" id="sent-title">届けました！</div>
    <div class="note">相手に「届いたよ」とLINEで知らせますか？</div>
    <button class="line-btn" id="btn-line-notify">LINEで知らせる</button>
    <button class="link" id="btn-sent-close">とじる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Firebase設定 —「アプリで届ける」「受信箱」を使う場合のみ入力
   （未設定でも、共有ボタンでLINE等に送ることはできます）

   手順:
   1. https://console.firebase.google.com でプロジェクト作成
   2. Authentication → ログイン方法 → 「匿名」を有効化
   3. Firestore Database を作成
   4. プロジェクト設定 → ウェブアプリ → 設定値を下記に貼り付け
   5. Firestore のルールを次のように設定:

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /names/{name} {
         allow read: if request.auth != null;
         allow create: if request.auth != null
                       && request.resource.data.uid == request.auth.uid;
       }
       match /users/{uid} {
         allow read: if request.auth != null;
         allow write: if request.auth != null && request.auth.uid == uid;
         match /inbox/{id} {
           allow read, update, delete: if request.auth != null && request.auth.uid == uid;
           allow create: if request.auth != null
                         && request.resource.data.from == request.auth.uid;
         }
       }
     }
   }
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const FB_CONFIG = {
  apiKey:            "AIzaSyBajglgEdUCfeZcv6NLLW1e199wKw5MMow",
  authDomain:        "oekaki-letter.firebaseapp.com",
  projectId:         "oekaki-letter",
  storageBucket:     "oekaki-letter.firebasestorage.app",
  messagingSenderId: "720809515540",
  appId:             "1:720809515540:web:22d3f0b5cb3820f927e501"
};

/* ── helpers ── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}
function show(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + name));
  window.scrollTo(0, 0);
  if (name === 'send') prepareSend();
  if (name === 'inbox') renderInbox();
}
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show(b.dataset.back));

/* ━━━━━━━━━━ お絵かき ━━━━━━━━━━ */
const SIZE = 1080;                       // 内部解像度（正方形）
const PALETTE = ['#2b2622','#ffffff','#e5484d','#ff8a3d','#ffd23f','#3bb273','#2fa8e0','#4f5bd5','#a45ee5','#ff7eb6','#8b5a3c','#9aa0a6'];
const BGS = ['#ffffff','#fff6d8','#ffe4ec','#e3f4ff','#e7f7e3','#2b2622'];

const cv = $('#cv-layer');
cv.width = cv.height = SIZE;
const ctx = cv.getContext('2d');
const board = $('#board');

const saved = store.get('oekaki-doc', null);
let ops   = Array.isArray(saved?.ops) ? saved.ops : [];   // {t:'s',tool,color,size,pts:[[x,y],...]} | {t:'c'}
let redo  = [];
let bg    = saved?.bg || BGS[0];
let tool  = 'pen';
let color = PALETTE[0];
let size  = 8;
let cur   = null;

function persist(){ store.set('oekaki-doc', { ops, bg }); }

function strokeStyle(op){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = op.size;
  ctx.globalCompositeOperation = op.tool === 'eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = op.color;
}
function drawDot(p, op){
  ctx.beginPath(); ctx.arc(p[0], p[1], op.size / 2, 0, Math.PI * 2); ctx.fill();
}
// 中点を使った滑らかな曲線で i 番目の区間を描く
function drawSegment(op, i){
  const p = op.pts;
  if (i === 0) { drawDot(p[0], op); return; }
  const a = p[i - 2] || p[i - 1], b = p[i - 1], c = p[i];
  const m1 = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m2 = [(b[0] + c[0]) / 2, (b[1] + c[1]) / 2];
  ctx.beginPath(); ctx.moveTo(m1[0], m1[1]); ctx.quadraticCurveTo(b[0], b[1], m2[0], m2[1]); ctx.stroke();
}
function drawOp(op){
  if (op.t === 'c') { ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, SIZE, SIZE); return; }
  strokeStyle(op);
  for (let i = 0; i < op.pts.length; i++) drawSegment(op, i);
  // 最後の半区間
  const n = op.pts.length;
  if (n > 1) {
    const b = op.pts[n - 2], c = op.pts[n - 1];
    ctx.beginPath(); ctx.moveTo((b[0] + c[0]) / 2, (b[1] + c[1]) / 2); ctx.lineTo(c[0], c[1]); ctx.stroke();
  }
}
function redraw(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, SIZE, SIZE);
  ops.forEach(drawOp);
  board.style.background = bg;
  updateUndo();
}
function updateUndo(){
  $('#btn-undo').disabled = !ops.length;
  $('#btn-redo').disabled = !redo.length;
}

function toPt(e){
  const r = cv.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) / r.width * SIZE * 10) / 10,
          Math.round((e.clientY - r.top) / r.height * SIZE * 10) / 10];
}
cv.addEventListener('pointerdown', e => {
  if (cur) return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  const scale = SIZE / cv.getBoundingClientRect().width;
  cur = { t:'s', tool, color, size: Math.round(size * scale * (tool === 'eraser' ? 2 : 1)), pts:[toPt(e)], id:e.pointerId };
  strokeStyle(cur); drawSegment(cur, 0);
});
cv.addEventListener('pointermove', e => {
  if (!cur || e.pointerId !== cur.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  strokeStyle(cur);
  for (const ev of (evs.length ? evs : [e])) {
    const p = toPt(ev), last = cur.pts[cur.pts.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 1.5) continue;
    cur.pts.push(p);
    drawSegment(cur, cur.pts.length - 1);
  }
});
function endStroke(e){
  if (!cur || e.pointerId !== cur.id) return;
  const op = cur; cur = null; delete op.id;
  ops.push(op); redo = [];
  redraw(); persist();
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

$('#btn-undo').onclick = () => { if (ops.length) { redo.push(ops.pop()); redraw(); persist(); } };
$('#btn-redo').onclick = () => { if (redo.length) { ops.push(redo.pop()); redraw(); persist(); } };
$('#btn-clear').onclick = () => {
  if (!ops.length || ops[ops.length - 1].t === 'c') return;
  ops.push({ t:'c' }); redo = []; redraw(); persist();
  toast('消しました（↶で戻せます）');
};

/* tool UI */
document.querySelectorAll('#tool-seg button').forEach(b => b.onclick = () => {
  tool = b.dataset.tool;
  document.querySelectorAll('#tool-seg button').forEach(x => x.classList.toggle('on', x === b));
  updateSizeDot();
});
function renderColors(){
  const wrap = $('#colors');
  wrap.innerHTML = PALETTE.map(c => `<button class="sw${c === color ? ' on' : ''}" style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join('')
    + `<label class="sw custom${PALETTE.includes(color) ? '' : ' on'}" title="好きな色"><input type="color" id="custom-color" value="${color}"></label>`;
  wrap.querySelectorAll('[data-c]').forEach(b => b.onclick = () => setColor(b.dataset.c));
  $('#custom-color').oninput = e => setColor(e.target.value);
}
function setColor(c){
  color = c;
  if (tool === 'eraser') $('#tool-seg [data-tool=pen]').click();
  renderColors(); updateSizeDot();
}
function renderBgs(){
  $('#bgs').innerHTML = BGS.map(c => `<button class="bg-sw${c === bg ? ' on' : ''}" style="background:${c}" data-bg="${c}" aria-label="背景 ${c}"></button>`).join('');
  $('#bgs').querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { bg = b.dataset.bg; renderBgs(); redraw(); persist(); });
}
function updateSizeDot(){
  const d = $('#size-dot'), s = Math.max(3, Math.min(32, size * (tool === 'eraser' ? 2 : 1)));
  d.style.width = d.style.height = s + 'px';
  d.style.background = tool === 'eraser' ? '#ccc' : color;
  d.style.border = color.toLowerCase() === '#ffffff' && tool !== 'eraser' ? '1px solid #ccc' : 'none';
  $('#size-label').textContent = size;
}
$('#size').oninput = e => { size = +e.target.value; updateSizeDot(); };

renderColors(); renderBgs(); updateSizeDot(); redraw();

/* ━━━━━━━━━━ 書き出し ━━━━━━━━━━ */
function exportCanvas(px){
  const out = document.createElement('canvas');
  out.width = out.height = px;
  const o = out.getContext('2d');
  o.fillStyle = bg; o.fillRect(0, 0, px, px);
  o.imageSmoothingQuality = 'high';
  o.drawImage(cv, 0, 0, px, px);
  return out;
}
const toBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
const isEmpty = () => !ops.length || ops[ops.length - 1].t === 'c';

$('#btn-next').onclick = () => {
  if (isEmpty()) { toast('まずは絵をかいてね'); return; }
  show('send');
};

let sendBlob = null;
async function prepareSend(){
  sendBlob = await toBlob(exportCanvas(SIZE), 'image/png');
  const prev = $('#send-preview');
  if (prev.src) URL.revokeObjectURL(prev.src);
  prev.src = URL.createObjectURL(sendBlob);
  renderDirect();
}
function fileName(){
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `oekaki_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.png`;
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#btn-share').onclick = async () => {
  if (!sendBlob) return;
  const file = new File([sendBlob], fileName(), { type:'image/png' });
  const text = $('#send-msg').value.trim();
  if (navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ files:[file], text: text || undefined }); }
    catch (e) { if (e.name !== 'AbortError') toast('共有できませんでした'); }
  } else {
    downloadBlob(sendBlob, file.name);
    toast('この端末は共有に未対応のため、画像を保存しました');
  }
};
$('#btn-save').onclick = () => { if (sendBlob) { downloadBlob(sendBlob, fileName()); toast('保存しました'); } };

/* ━━━━━━━━━━ Firebase（アプリ内で届ける） ━━━━━━━━━━ */
const FB_ON = !!FB_CONFIG.apiKey;
let auth = null, db = null, me = null, myName = null, inbox = [], unsubInbox = null;
const NAME_RE = /^[a-zA-Z0-9_ぁ-んァ-ヶー一-龠]{2,16}$/;

if (FB_ON) {
  try {
    firebase.initializeApp(FB_CONFIG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(async user => {
      if (!user) { auth.signInAnonymously().catch(e => console.error(e)); return; }
      me = user;
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        myName = doc.exists ? doc.data().name : null;
      } catch (e) { console.error(e); }
      listenInbox(); renderDirect(); renderMe();
    });
  } catch (e) { console.error('Firebase init error:', e); }
}

function listenInbox(){
  if (unsubInbox || !me) return;
  unsubInbox = db.collection('users').doc(me.uid).collection('inbox')
    .orderBy('createdAt', 'desc').limit(50)
    .onSnapshot(snap => {
      if (inboxLoaded) {
        snap.docChanges().filter(c => c.type === 'added' && !c.doc.data().read)
          .forEach(c => notifyArrival(c.doc.data()));
      }
      inboxLoaded = true;
      inbox = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      const n = inbox.filter(x => !x.read).length;
      const b = $('#inbox-badge'); b.textContent = n; b.classList.toggle('on', n > 0);
      if ($('#scr-inbox').classList.contains('active')) renderInbox();
    }, e => console.error(e));
}

async function registerName(name){
  const ref = db.collection('names').doc(name);
  await db.runTransaction(async tx => {
    const s = await tx.get(ref);
    if (s.exists && s.data().uid !== me.uid) throw new Error('taken');
    tx.set(ref, { uid: me.uid });
    tx.set(db.collection('users').doc(me.uid), { name }, { merge:true });
  });
  myName = name;
}

function nameForm(target, onDone){
  target.innerHTML = `
    <div class="note">あなたの「なまえ」を決めてください。相手はこのなまえ宛てに絵を送ります。<br>（2〜16文字・あとから変更できません）</div>
    <input type="text" id="name-in" maxlength="16" placeholder="例: torachan">
    <div class="err" id="name-err"></div>
    <button class="primary" id="name-ok">決定</button>`;
  target.querySelector('#name-ok').onclick = async () => {
    const v = target.querySelector('#name-in').value.trim(), err = target.querySelector('#name-err');
    if (!NAME_RE.test(v)) { err.textContent = '2〜16文字の英数字・ひらがな・カタカナ・漢字で入力してね'; return; }
    try { await registerName(v); toast(`「${v}」で登録しました`); onDone(); renderMe(); }
    catch (e) { err.textContent = e.message === 'taken' ? 'そのなまえは使われています' : '登録できませんでした'; console.error(e); }
  };
}

function renderDirect(){
  const body = $('#direct-body');
  if (!FB_ON) {
    body.innerHTML = `<div class="note">この機能を使うには Firebase の設定が必要です（index.html 内の FB_CONFIG）。<br>下の「共有する」なら今すぐ送れます。</div>`;
    return;
  }
  if (!me) { body.innerHTML = `<div class="note">接続中…</div>`; return; }
  if (!myName) { nameForm(body, renderDirect); return; }
  const last = store.get('oekaki-last-to', '');
  body.innerHTML = `
    <div class="note">送り先のなまえを入力してください。</div>
    <input type="text" id="to-in" maxlength="16" placeholder="相手のなまえ" value="${esc(last)}">
    <div class="err" id="to-err"></div>
    <button class="primary" id="btn-direct">💌 届ける</button>`;
  $('#btn-direct').onclick = sendDirect;
}

async function sendDirect(){
  const to = $('#to-in').value.trim(), err = $('#to-err'), btn = $('#btn-direct');
  err.textContent = '';
  if (!to) { err.textContent = '送り先を入力してね'; return; }
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    const n = await db.collection('names').doc(to).get();
    if (!n.exists) throw new Error('notfound');
    // Firestore の1MB制限に収まるよう縮小・圧縮
    let image = '';
    for (const [px, q] of [[720, .9], [640, .8], [512, .7]]) {
      image = exportCanvas(px).toDataURL('image/jpeg', q);
      if (image.length < 900000) break;
    }
    await db.collection('users').doc(n.data().uid).collection('inbox').add({
      from: me.uid, fromName: myName, image,
      message: $('#send-msg').value.trim().slice(0, 140),
      read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    store.set('oekaki-last-to', to);
    $('#send-msg').value = '';
    show('draw');
    openSentModal(to);
  } catch (e) {
    err.textContent = e.message === 'notfound' ? 'そのなまえの人は見つかりません' : '送信できませんでした';
    console.error(e);
  } finally { btn.disabled = false; btn.textContent = '💌 届ける'; }
}

$('#btn-inbox').onclick = () => show('inbox');

/* ── 届いた通知 ── */
let inboxLoaded = false;
const APP_URL = location.origin + location.pathname;
async function notifyArrival(x){
  const body = x.message ? x.message : '新しい絵が届きました';
  toast(`🎨 ${x.fromName} さんから絵が届きました`);
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    const opt = { body, icon:'icon.svg', badge:'icon.svg', tag:'oekaki-' + (x.createdAt?.seconds || Date.now()), data:{ url: APP_URL + '#inbox' } };
    if (reg) await reg.showNotification(`${x.fromName} さんから絵が届きました`, opt);
    else new Notification(`${x.fromName} さんから絵が届きました`, opt);
  } catch (e) { console.error(e); }
}
function notifyCard(){
  if (!('Notification' in window)) return '';
  if (Notification.permission === 'granted') return `<div class="note">🔔 通知：オン（アプリを開いている間・バックグラウンドの間に届きます）</div>`;
  if (Notification.permission === 'denied') return `<div class="note">🔕 通知はブラウザの設定でブロックされています</div>`;
  return `<button class="ghost" id="btn-notify">🔔 届いたら通知する</button>`;
}

/* ── 送ったあと LINE で知らせる ── */
let lastSentTo = '';
function openSentModal(to){
  lastSentTo = to;
  $('#sent-title').textContent = `${to} さんに届けました！`;
  $('#sent-modal').classList.add('on');
}
$('#btn-sent-close').onclick = () => $('#sent-modal').classList.remove('on');
$('#btn-line-notify').onclick = () => {
  const text = `${myName} から絵が届いたよ🎨\nここから見てね👇\n${APP_URL}#inbox`;
  window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
  $('#sent-modal').classList.remove('on');
};

function renderMe(){
  const c = $('#me-card');
  if (!FB_ON) { c.innerHTML = `<div class="note">受信箱を使うには Firebase の設定が必要です（index.html 内の FB_CONFIG）。</div>`; return; }
  if (!me) { c.innerHTML = `<div class="note">接続中…</div>`; return; }
  if (!myName) { nameForm(c, () => {}); return; }
  c.innerHTML = `<div class="note">あなたのなまえ</div><div class="h2" style="font-size:20px">${esc(myName)}</div>
    <div class="note">このなまえを相手に教えると、絵を送ってもらえます。</div>${notifyCard()}`;
  const nb = c.querySelector('#btn-notify');
  if (nb) nb.onclick = async () => {
    const r = await Notification.requestPermission();
    toast(r === 'granted' ? '通知をオンにしました' : '通知はオフのままです');
    renderMe();
  };
}

function fmtDate(ts){
  if (!ts?.toDate) return '';
  const d = ts.toDate();
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function renderInbox(){
  renderMe();
  const list = $('#inbox-list');
  if (!FB_ON || !me) { list.innerHTML = ''; return; }
  if (!inbox.length) { list.innerHTML = `<div class="empty">まだ絵は届いていません 🎨</div>`; return; }
  list.innerHTML = inbox.map(x => `
    <div class="item" data-id="${esc(x.id)}">
      <img src="${esc(x.image)}" alt="${esc(x.fromName)}さんからの絵" loading="lazy">
      <div class="meta">
        <div class="from">${esc(x.fromName)} さんから${x.read ? '' : '<span class="new">NEW</span>'}</div>
        ${x.message ? `<div class="msg">${esc(x.message)}</div>` : ''}
        <div class="when">${fmtDate(x.createdAt)}</div>
      </div>
      <div class="acts">
        <button data-act="save">保存</button>
        <button data-act="reply">返事をかく</button>
        <button data-act="del">削除</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('.item').forEach(el => {
    const x = inbox.find(i => i.id === el.dataset.id);
    const ref = db.collection('users').doc(me.uid).collection('inbox').doc(x.id);
    el.querySelector('[data-act=save]').onclick = async () => {
      const blob = await (await fetch(x.image)).blob();
      downloadBlob(blob, `from_${x.fromName}.jpg`);
    };
    el.querySelector('[data-act=reply]').onclick = () => {
      store.set('oekaki-last-to', x.fromName);
      show('draw'); toast(`${x.fromName} さんへの返事をかこう`);
    };
    el.querySelector('[data-act=del]').onclick = async () => {
      if (confirm('この絵を削除しますか？')) await ref.delete().catch(console.error);
    };
  });
  // 開いたら既読に
  inbox.filter(x => !x.read).forEach(x =>
    db.collection('users').doc(me.uid).collection('inbox').doc(x.id).update({ read:true }).catch(() => {}));
}
renderMe();

if (location.hash === '#inbox') show('inbox');

/* ── PWA ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
