<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>おえかきレター</title>
  <meta name="theme-color" content="#ff7a59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="おえかき">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root{
      --accent:#ff7a59; --accent-2:#ffb547; --bg:#fff7f0; --card:#ffffff;
      --ink:#2b2622; --sub:#8a7f77; --line:#f0e4da; --shadow:0 4px 18px rgba(80,40,20,.10);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
      background:var(--bg); color:var(--ink);
      display:flex; flex-direction:column; align-items:center;
      padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
      overscroll-behavior:none;
    }
    button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
    .screen{display:none;width:100%;max-width:520px;flex-direction:column;gap:12px;}
    .screen.active{display:flex;}

    /* header */
    .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .logo{font-size:20px;font-weight:800;letter-spacing:.02em;}
    .logo span{color:var(--accent);}
    .hdr-btns{display:flex;gap:8px;}
    .icon-btn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:20px;}
    .icon-btn:disabled{opacity:.35;}
    .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;}
    .badge.on{display:flex;}

    /* canvas */
    .board{position:relative;width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#fff;touch-action:none;}
    .board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none;}
    .board #cv-live{pointer-events:auto;}
    .brushes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
    .brush{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px 6px;border-radius:12px;background:var(--bg);font-size:12px;font-weight:700;color:var(--sub);border:2px solid transparent;}
    .brush canvas{width:100%;max-width:64px;height:24px;border-radius:6px;}
    .brush.on{border-color:var(--accent);color:var(--ink);background:var(--card);}
    .sw-edit{position:relative;}
    .sw-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#2b2622;color:#fff;font-size:11px;line-height:18px;text-align:center;}
    .sw-add{background:var(--bg);border:2px dashed var(--sub);font-size:16px;color:var(--sub);line-height:26px;text-align:center;}
    .sw input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
    .pal-note{width:100%;font-size:12px;color:var(--sub);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;}
    .bg-sw.chalk{width:44px;background:#2f4b3c;color:#fff;font-size:11px;font-weight:700;}
    .bg-sw.base{width:44px;background-size:cover;background-position:center;}

    /* tools */
    .tools{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:12px;}
    .row{display:flex;align-items:center;gap:8px;}
    .row.between{justify-content:space-between;}
    .seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;}
    .seg button{padding:7px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);}
    .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
    .colors{display:flex;flex-wrap:wrap;gap:8px;}
    .sw{display:block;width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.08);position:relative;}
    .sw.on{outline:3px solid var(--accent);outline-offset:2px;}
    .sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden;}
    .sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
    .size-wrap{flex:1;display:flex;align-items:center;gap:10px;}
    .size-dot{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .size-dot i{display:block;border-radius:50%;background:var(--ink);}
    input[type=range]{flex:1;accent-color:var(--accent);}
    .label{font-size:12px;color:var(--sub);font-weight:600;min-width:28px;}
    .bg-sw{width:26px;height:26px;border-radius:8px;border:2px solid rgba(0,0,0,.1);}
    .bg-sw.on{outline:3px solid var(--accent);outline-offset:1px;}

    .primary{width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(255,122,89,.35);}
    .primary:disabled{opacity:.5;}
    .ghost{width:100%;padding:13px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:700;}
    .link{color:var(--sub);font-size:14px;padding:8px;text-decoration:underline;}

    /* send screen */
    .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;}
    .preview{width:100%;border-radius:14px;border:1px solid var(--line);display:block;}
    textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);outline:none;resize:none;}
    textarea:focus,input[type=text]:focus{border-color:var(--accent);}
    .h2{font-size:15px;font-weight:800;}
    .note{font-size:13px;color:var(--sub);line-height:1.6;}
    .err{font-size:13px;color:#d33;min-height:1em;}

    /* inbox */
    .list{display:flex;flex-direction:column;gap:12px;}
    .item{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
    .item img{width:100%;display:block;background:#fff;}
    .item .meta{padding:10px 14px;display:flex;flex-direction:column;gap:4px;}
    .item .from{font-weight:800;font-size:14px;}
    .item .from .new{background:#e5484d;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;}
    .item .msg{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
    .item .when{font-size:11px;color:var(--sub);}
    .item .acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px;}
    .item .acts button{font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;background:var(--bg);}
    .empty{text-align:center;color:var(--sub);padding:48px 0;font-size:14px;}

    .modal-bg{display:none;position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:500;align-items:center;justify-content:center;padding:24px;}
    .modal-bg.on{display:flex;}
    .modal{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center;}
    .modal .big{font-size:42px;}
    .line-btn{width:100%;padding:14px;border-radius:14px;background:#06c755;color:#fff;font-size:16px;font-weight:800;}
    .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(30,25,20,.92);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90vw;text-align:center;}
    .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>

<!-- ━━━━━━━━━━ お絵かき画面 ━━━━━━━━━━ -->
<section id="scr-draw" class="screen active">

    <div class="logo">おえかき<span>レター</span></div>
    <div class="hdr-btns">

      <button class="icon-btn" id="btn-redo" title="やり直す">↷</button>

    </div>
  </div>

  <div class="board" id="board">
    <canvas id="cv-bg"></canvas>
    <canvas id="cv-layer"></canvas>

  <div class="tools">
    <div class="brushes" id="brushes"></div>
    <div class="row between">
      <span class="label">色</span>

    </div>
    <div class="colors" id="colors"></div>

    <div class="row">

<!-- ━━━━━━━━━━ 送信画面 ━━━━━━━━━━ -->
<section id="scr-send" class="screen">
  <div class="hdr">
    <button class="icon-btn" data-back="draw" title="戻る">←</button>
    <div class="logo">送る</div>
    <div style="width:42px"></div>
  </div>

  <div class="card">
    <img id="send-preview" class="preview" alt="送る絵">
    <textarea id="send-msg" rows="2" maxlength="140" placeholder="ひとことメッセージ（なくてもOK）"></textarea>
  </div>

  <div class="card" id="direct-card">
    <div class="h2">📮 アプリで届ける</div>
    <div id="direct-body"></div>
  </div>

  <div class="card">
    <div class="h2">📤 ほかのアプリで送る</div>
    <div class="note">LINE・メール・メッセージなどに画像として送れます。</div>
    <button class="ghost" id="btn-share">共有する</button>
    <button class="ghost" id="btn-save">画像を保存</button>
  </div>
</section>

<!-- ━━━━━━━━━━ 受信箱 ━━━━━━━━━━ -->
<section id="scr-inbox" class="screen">
  <div class="hdr">
    <button class="icon-btn" data-back="draw" title="戻る">←</button>
    <div class="logo">受信箱</div>
    <div style="width:42px"></div>
  </div>
  <div class="card" id="me-card"></div>
  <div class="list" id="inbox-list"></div>
</section>

<div class="modal-bg" id="sent-modal">
  <div class="modal">
    <div class="big">💌</div>
    <div class="h2" id="sent-title">届けました！</div>
    <div class="note">相手に「届いたよ」とLINEで知らせますか？</div>
    <button class="line-btn" id="btn-line-notify">LINEで知らせる</button>
    <button class="link" id="btn-sent-close">とじる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Firebase設定 —「アプリで届ける」「受信箱」を使う場合のみ入力
   （未設定でも、共有ボタンでLINE等に送ることはできます）

   手順:
   1. https://console.firebase.google.com でプロジェクト作成
   2. Authentication → ログイン方法 → 「匿名」を有効化
   3. Firestore Database を作成
   4. プロジェクト設定 → ウェブアプリ → 設定値を下記に貼り付け
   5. Firestore のルールを次のように設定:

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /names/{name} {
         allow read: if request.auth != null;
         allow create: if request.auth != null
                       && request.resource.data.uid == request.auth.uid;
       }
       match /users/{uid} {
         allow read: if request.auth != null;
         allow write: if request.auth != null && request.auth.uid == uid;
         match /inbox/{id} {
           allow read, update, delete: if request.auth != null && request.auth.uid == uid;
           allow create: if request.auth != null
                         && request.resource.data.from == request.auth.uid;
         }
       }
     }
   }
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const FB_CONFIG = {
  apiKey:            "AIzaSyBajglgEdUCfeZcv6NLLW1e199wKw5MMow",
  authDomain:        "oekaki-letter.firebaseapp.com",
  projectId:         "oekaki-letter",
  storageBucket:     "oekaki-letter.firebasestorage.app",
  messagingSenderId: "720809515540",
  appId:             "1:720809515540:web:22d3f0b5cb3820f927e501"
};

/* ── helpers ── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let toastTimer;
function toast(msg, ms = 2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}
function show(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + name));
  window.scrollTo(0, 0);
  if (name === 'send') prepareSend();
  if (name === 'inbox') renderInbox();
}
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show(b.dataset.back));

/* ━━━━━━━━━━ お絵かき ━━━━━━━━━━ */
const SIZE = 1080;                       // 内部解像度（正方形）
const DEFAULT_PALETTE = ['#2b2622','#ffffff','#e5484d','#ff8a3d','#ffd23f','#3bb273','#2fa8e0','#4f5bd5','#a45ee5','#ff7eb6','#8b5a3c','#9aa0a6'];
const BGS = ['#ffffff','#fff6d8','#ffe4ec','#e3f4ff','#e7f7e3','#2b2622','chalkboard'];
const CHALK_GREEN = '#2f4b3c';

// ブラシの種類（alpha があるものは1本の線を描いてから半透明で重ねる）
const BR = {
  pen:    { name:'ペン',     alpha:0 },
  brush:  { name:'筆',       alpha:0 },
  water:  { name:'水彩',     alpha:.45 },
  chalk:  { name:'チョーク', alpha:0 },
  pencil: { name:'えんぴつ', alpha:0 },
  spray:  { name:'スプレー', alpha:0 },
  neon:   { name:'ネオン',   alpha:0 },
  eraser: { name:'消しゴム', alpha:0 },
};
const LINE_TOOLS = new Set(['pen','eraser','water','neon','brush']);

const bgCv = $('#cv-bg'), cv = $('#cv-layer'), live = $('#cv-live');
[bgCv, cv, live].forEach(c => c.width = c.height = SIZE);
const bgctx = bgCv.getContext('2d'), ctx = cv.getContext('2d'), lctx = live.getContext('2d');

const isHex = c => /^#[0-9a-f]{6}$/i.test(c);
const saved = store.get('oekaki-doc', null);
let ops     = Array.isArray(saved?.ops) ? saved.ops : [];   // {t:'s',tool,color,size,seed,pts:[[x,y,w?],...]} | {t:'c'}
let redo    = [];
let bg      = BGS.includes(saved?.bg) ? saved.bg : BGS[0];
let base    = typeof saved?.base === 'string' ? saved.base : null;   // 返信で描き足すときの相手の絵
let baseImg = null;
let palette = (store.get('oekaki-palette', null) || DEFAULT_PALETTE).filter(isHex);
if (!palette.length) palette = DEFAULT_PALETTE.slice();
let palEdit = false;
let tool    = 'pen', lastBrush = 'pen';
let color   = palette[0];
let size    = 8;
let cur     = null;

function persist(){ store.set('oekaki-doc', { ops, bg, base }); }

/* ── 乱数（同じ線は何度描き直しても同じ見た目になるように seed 付き） ── */
function rngFor(seed, i){
  let a = (Math.imul(seed | 0, 2654435761) ^ Math.imul(i + 1, 40503)) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ── 線の描画 ── */
function dot(g, x, y, r){ g.beginPath(); g.arc(x, y, Math.max(.5, r), 0, Math.PI * 2); g.fill(); }
// 中点を使った滑らかな曲線で i 番目の区間（tail=true なら最後の半区間）を描く
function curve(g, p, i, tail){
  if (tail) {
    const n = p.length; if (n < 2) return;
    const b = p[n - 2], c = p[n - 1];
    g.beginPath(); g.moveTo((b[0] + c[0]) / 2, (b[1] + c[1]) / 2); g.lineTo(c[0], c[1]); g.stroke();
    return;
  }
  const a = p[i - 2] || p[i - 1], b = p[i - 1], c = p[i];
  g.beginPath(); g.moveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  g.quadraticCurveTo(b[0], b[1], (b[0] + c[0]) / 2, (b[1] + c[1]) / 2); g.stroke();
}
// 区間に沿って点を打つブラシ用：a→b を step ごとに歩く
function walk(p, i, step, fn){
  const a = p[Math.max(0, i - 1)], b = p[i];
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const n = Math.max(1, Math.ceil(len / step));
  for (let k = 0; k < n; k++) {
    const t = i === 0 ? 0 : (k + 1) / n;
    fn(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t);
  }
}

function drawSeg(g, op, i, tail = false){
  const p = op.pts, s = op.size, col = op.color;
  const lineOrDot = r => (i === 0 && !tail) ? dot(g, p[0][0], p[0][1], r) : curve(g, p, i, tail);
  g.save();
  g.lineCap = g.lineJoin = 'round';
  switch (op.tool) {
    case 'eraser':
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = g.fillStyle = '#000'; g.lineWidth = s;
      lineOrDot(s / 2);
      break;
    case 'water': {
      const r = rngFor(op.seed, i);
      g.strokeStyle = g.fillStyle = col; g.lineWidth = s * (.85 + .3 * r());
      g.shadowColor = col; g.shadowBlur = s * .4;
      lineOrDot(s / 2);
      break;
    }
    case 'brush': {
      g.strokeStyle = g.fillStyle = col;
      const wOf = q => q[2] || s;
      if (i === 0 && !tail) { dot(g, p[0][0], p[0][1], wOf(p[0]) / 2); break; }
      const j = tail ? p.length - 1 : i;
      g.lineWidth = (wOf(p[j - 1]) + wOf(p[j])) / 2;
      curve(g, p, i, tail);
      break;
    }
    case 'neon':
      g.strokeStyle = g.fillStyle = col; g.lineWidth = s;
      g.shadowColor = col; g.shadowBlur = s * 1.6;
      lineOrDot(s / 2);
      g.shadowBlur = s * .4;
      g.strokeStyle = g.fillStyle = 'rgba(255,255,255,.85)'; g.lineWidth = s * .35;
      lineOrDot(s * .18);
      break;
    case 'chalk': {
      if (tail) break;
      const r = rngFor(op.seed, i), per = Math.max(4, Math.round(s * .9));
      g.fillStyle = col;
      walk(p, i, Math.max(1.5, s * .12), (x, y) => {
        for (let k = 0; k < per; k++) {
          const ang = r() * Math.PI * 2, rad = s / 2 * Math.sqrt(r()), d = 1 + r() * s * .06;
          g.globalAlpha = .35 + r() * .6;
          g.fillRect(x + Math.cos(ang) * rad, y + Math.sin(ang) * rad, d, d);
        }
      });
      break;
    }
    case 'pencil': {
      if (tail) break;
      const r = rngFor(op.seed, i), w = Math.max(2, s * .45);
      g.strokeStyle = g.fillStyle = col;
      if (i > 0) {
        g.globalAlpha = .6; g.lineWidth = w * .5; g.lineCap = 'butt';
        const a = p[i - 1], b = p[i];
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
      }
      walk(p, i, 1.2, (x, y) => {
        for (let k = 0; k < 3; k++) {
          g.globalAlpha = .12 + r() * .35;
          g.fillRect(x + (r() - .5) * w * .9, y + (r() - .5) * w * .9, 1.1, 1.1);
        }
      });
      break;
    }
    case 'spray': {
      if (tail) break;
      const r = rngFor(op.seed, i), R = s * 1.2, per = Math.max(6, Math.round(s * 1.1));
      g.fillStyle = col;
      walk(p, i, R * .5, (x, y) => {
        for (let k = 0; k < per; k++) {
          const ang = r() * Math.PI * 2, rad = R * Math.sqrt(r()), d = 1 + r() * 1.6;
          g.globalAlpha = .45 + r() * .55;
          g.fillRect(x + Math.cos(ang) * rad, y + Math.sin(ang) * rad, d, d);
        }
      });
      break;
    }
    default: // pen
      g.strokeStyle = g.fillStyle = col; g.lineWidth = s;
      lineOrDot(s / 2);
  }
  g.restore();
}

function renderStroke(g, op){
  for (let i = 0; i < op.pts.length; i++) drawSeg(g, op, i);
  if (LINE_TOOLS.has(op.tool)) drawSeg(g, op, op.pts.length - 1, true);
}
// 半透明ブラシは別のキャンバスに描いてから重ねる（線の重なりで濃くならないように）
const scratch = document.createElement('canvas');
function commitOp(g, op, w = SIZE, h = SIZE){
  if (op.t === 'c') { g.clearRect(0, 0, w, h); return; }
  const alpha = BR[op.tool]?.alpha;
  if (!alpha) { renderStroke(g, op); return; }
  if (scratch.width !== w || scratch.height !== h) { scratch.width = w; scratch.height = h; }
  const sg = scratch.getContext('2d');
  sg.clearRect(0, 0, w, h);
  renderStroke(sg, op);
  g.save(); g.globalAlpha = alpha; g.drawImage(scratch, 0, 0); g.restore();
}

/* ── 背景 ── */
function paintBg(){
  bgctx.clearRect(0, 0, SIZE, SIZE);
  if (base && baseImg?.complete && baseImg.naturalWidth) { bgctx.drawImage(baseImg, 0, 0, SIZE, SIZE); return; }
  if (bg !== 'chalkboard') { bgctx.fillStyle = bg; bgctx.fillRect(0, 0, SIZE, SIZE); return; }
  // 黒板：深緑＋チョークの粉っぽいムラ
  bgctx.fillStyle = CHALK_GREEN; bgctx.fillRect(0, 0, SIZE, SIZE);
  const r = rngFor(20251117, 0);
  for (let k = 0; k < 14; k++) {
    const x = r() * SIZE, y = r() * SIZE, rad = 120 + r() * 260;
    const gr = bgctx.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(255,255,255,${.03 + r() * .04})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    bgctx.fillStyle = gr; bgctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let k = 0; k < 9000; k++) {
    bgctx.fillStyle = r() < .5 ? `rgba(255,255,255,${r() * .06})` : `rgba(0,0,0,${r() * .08})`;
    bgctx.fillRect(r() * SIZE, r() * SIZE, 2, 2);
  }
  // こすった跡
  bgctx.strokeStyle = 'rgba(255,255,255,.035)'; bgctx.lineCap = 'round';
  for (let k = 0; k < 6; k++) {
    bgctx.lineWidth = 40 + r() * 70;
    const y = r() * SIZE;
    bgctx.beginPath(); bgctx.moveTo(r() * 300, y); bgctx.quadraticCurveTo(SIZE / 2, y + (r() - .5) * 200, SIZE - r() * 300, y + (r() - .5) * 120); bgctx.stroke();
  }
}
function setBase(url){
  base = url; baseImg = null;
  if (url) {
    baseImg = new Image();
    baseImg.onload = () => { paintBg(); renderBgs(); };
    baseImg.src = url;
  }
  paintBg(); renderBgs(); persist();
}

function redraw(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, SIZE, SIZE);
  ops.forEach(op => commitOp(ctx, op));
  updateUndo();
}
function updateUndo(){
  $('#btn-undo').disabled = !ops.length;
  $('#btn-redo').disabled = !redo.length;
}

/* ── 入力 ── */
function toPt(e){
  const r = live.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) / r.width * SIZE * 10) / 10,
          Math.round((e.clientY - r.top) / r.height * SIZE * 10) / 10];
}
const liveTarget = op => op.tool === 'eraser' ? ctx : lctx;
live.addEventListener('pointerdown', e => {
  if (cur) return;
  e.preventDefault();
  live.setPointerCapture(e.pointerId);
  const scale = SIZE / live.getBoundingClientRect().width;
  const s = Math.round(size * scale * (tool === 'eraser' ? 2 : 1));
  const p = toPt(e);
  if (tool === 'brush') p[2] = Math.round(s * 3.5) / 10;
  cur = { t:'s', tool, color, size:s, seed:(Math.random() * 2 ** 31) | 0, pts:[p], id:e.pointerId, lt:e.timeStamp };
  lctx.clearRect(0, 0, SIZE, SIZE);
  live.style.opacity = BR[tool].alpha || 1;
  drawSeg(liveTarget(cur), cur, 0);
});
live.addEventListener('pointermove', e => {
  if (!cur || e.pointerId !== cur.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (evs.length ? evs : [e])) {
    const p = toPt(ev), last = cur.pts[cur.pts.length - 1];
    const d = Math.hypot(p[0] - last[0], p[1] - last[1]);
    if (d < 1.5) continue;
    if (cur.tool === 'brush') {
      // 速く動かすと細く、ゆっくりだと太く
      const speed = d / Math.max(1, ev.timeStamp - cur.lt);
      const target = cur.size * Math.min(1.3, Math.max(.25, 1.3 - speed * .12));
      p[2] = Math.round((last[2] * .75 + target * .25) * 10) / 10;
    }
    cur.lt = ev.timeStamp;
    cur.pts.push(p);
    drawSeg(liveTarget(cur), cur, cur.pts.length - 1);
  }
});
function endStroke(e){
  if (!cur || e.pointerId !== cur.id) return;
  const op = cur; cur = null; delete op.id; delete op.lt;
  if (op.tool === 'brush') {
    // 筆の払い：最後に向かって細くする
    const n = op.pts.length, k = Math.min(8, n - 1);
    for (let j = 0; j < k; j++) op.pts[n - 1 - j][2] = Math.round(op.pts[n - 1 - j][2] * (j + 1) / (k + 1) * 10) / 10;
  }
  lctx.clearRect(0, 0, SIZE, SIZE);
  live.style.opacity = 1;
  if (op.tool === 'eraser') drawSeg(ctx, op, op.pts.length - 1, true);
  else commitOp(ctx, op);
  ops.push(op); redo = [];
  updateUndo(); persist();
}
live.addEventListener('pointerup', endStroke);
live.addEventListener('pointercancel', endStroke);

$('#btn-undo').onclick = () => { if (ops.length) { redo.push(ops.pop()); redraw(); persist(); } };
$('#btn-redo').onclick = () => { if (redo.length) { ops.push(redo.pop()); redraw(); persist(); } };
$('#btn-clear').onclick = () => {

/* ── ブラシ選択（見本つき） ── */
function renderBrushes(){
  const wrap = $('#brushes');
  wrap.innerHTML = Object.entries(BR).map(([id, b]) =>
    `<button class="brush${id === tool ? ' on' : ''}" data-tool="${id}"><canvas width="128" height="48"></canvas><span>${b.name}</span></button>`).join('');
  wrap.querySelectorAll('.brush').forEach(btn => {
    btn.onclick = () => setTool(btn.dataset.tool);
    drawBrushSample(btn.querySelector('canvas'), btn.dataset.tool);
  });
}
function isLight(c){
  if (!isHex(c)) return false;
  const n = parseInt(c.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  return (r * .299 + g * .587 + b * .114) > 200;
}
function drawBrushSample(c, id){
  const g = c.getContext('2d'), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const dark = id !== 'eraser' && isLight(color);
  g.fillStyle = dark ? '#4a4540' : (id === 'neon' ? '#221d2e' : '#fff');
  g.fillRect(0, 0, W, H);
  if (id === 'eraser') {
    g.fillStyle = '#c9c2bb'; g.fillRect(10, 18, W - 20, 12);
    g.clearRect(30, 14, 50, 20); g.fillStyle = '#fff'; g.fillRect(30, 14, 50, 20);
    return;
  }
  const pts = [];
  for (let k = 0; k <= 40; k++) {
    const t = k / 40, x = 12 + t * (W - 24), y = H / 2 + Math.sin(t * Math.PI * 2) * (H * .22);
    pts.push(id === 'brush' ? [x, y, 10 * Math.max(.2, Math.sin(Math.PI * t) * 1.2)] : [x, y]);
  }
  commitOp(g, { t:'s', tool:id, color, size: id === 'spray' ? 6 : 9, seed:7, pts }, W, H);
}
function setTool(id){
  tool = id;
  if (id !== 'eraser') lastBrush = id;
  document.querySelectorAll('#brushes .brush').forEach(x => x.classList.toggle('on', x.dataset.tool === id));

  if (!('Notification' in window)) return '';
  if (Notification.permission === 'granted') return PUSH_ON
    ? `<div class="note">🔔 通知：オン（アプリを閉じていても届きます）${pushStatus === 'ok' ? ' ✅登録済み' : pushStatus ? '<br>⚠️ 登録できませんでした（' + esc(pushStatus) + '）' : '<br>登録中…'}</div>` + `<button class="ghost" id="btn-test-notify">🔔 テスト通知を出す</button>`
    : `<div class="note">🔔 通知：オン（アプリを開いている間・バックグラウンドの間に届きます）</div>`;
  if (Notification.permission === 'denied') return `<div class="note">🔕 通知はブラウザの設定でブロックされています</div>`;
  return `<button class="ghost" id="btn-notify">🔔 届いたら通知する</button>`;
}

/* ── Web Push の登録と送信 ── */
let pushStatus = '';
async function syncPush(){
  if (!PUSH_ON || !me || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const raw = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
      sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: raw });
    }
    const mine = JSON.stringify(sub.toJSON());
    const ref = db.collection('users').doc(me.uid);
    const cur = ((await ref.get()).data()?.pushSubs || []);
    if (cur.includes(mine)) { pushStatus = 'ok'; renderMe(); return; }
    const endpoint = sub.endpoint;
    const next = [mine, ...cur.filter(x => { try { return JSON.parse(x).endpoint !== endpoint; } catch { return false; } })].slice(0, 5);
    await ref.set({ pushSubs: next }, { merge:true });
    pushStatus = 'ok';
  } catch (e) { console.error('push subscribe failed', e); pushStatus = 'エラー: ' + (e && (e.name + ' ' + e.message)); }
  renderMe();
}
async function pingPush(toUid){
  if (!PUSH_URL || !me) return;
  try {
    const idToken = await me.getIdToken();
    // text/plain にしてプリフライト無しで送る
    const r = await fetch(PUSH_URL, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ idToken, to: toUid }) });
    const txt = await r.text();
    let j = null; try { j = JSON.parse(txt); } catch {}
    if (!j) toast('🔔 通知サーバーが古いままです（Hello World）', 5000);
    else if (j.error) toast('🔔 通知エラー: ' + j.error, 5000);
    else if (j.sent > 0) toast('🔔 相手に通知しました', 5000);
    else if (j.results && j.results.length) toast('🔔 通知を送れませんでした（' + j.results.join(',') + '）', 5000);
    else toast('🔔 相手は通知をオンにしていません', 5000);
  } catch (e) { toast('🔔 通知サーバーにつながりません: ' + (e && e.message), 5000); }
}

/* ── 送ったあと LINE で知らせる ── */
let lastSentTo = '';
function openSentModal(to){
  lastSentTo = to;
  $('#sent-title').textContent = `${to} さんに届けました！`;
  $('#sent-modal').classList.add('on');
}
$('#btn-sent-close').onclick = () => $('#sent-modal').classList.remove('on');
$('#btn-line-notify').onclick = () => {
  const text = `${myName} から絵が届いたよ🎨\nここから見てね👇\n${APP_URL}#inbox`;
  window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
  $('#sent-modal').classList.remove('on');
};

function renderMe(){
  const c = $('#me-card');
  if (!FB_ON) { c.innerHTML = `<div class="note">受信箱を使うには Firebase の設定が必要です（index.html 内の FB_CONFIG）。</div>`; return; }
  if (!me) { c.innerHTML = `<div class="note">接続中…</div>`; return; }
  if (!myName) { nameForm(c, () => {}); return; }
  c.innerHTML = `<div class="note">あなたのなまえ</div><div class="h2" style="font-size:20px">${esc(myName)}</div>
    <div class="note">このなまえを相手に教えると、絵を送ってもらえます。</div>${notifyCard()}`;
  const tb = c.querySelector('#btn-test-notify');
  if (tb) tb.onclick = async () => {
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification('テスト通知です', { body:'これが見えたら通知はちゃんと出ます 🎨', icon:'icon.svg', tag:'oekaki-test' });
      toast('テスト通知を出しました');
    } catch (e) { toast('通知を出せませんでした: ' + (e && e.message)); }
  };
  const nb = c.querySelector('#btn-notify');
  if (nb) nb.onclick = async () => {
    const r = await Notification.requestPermission();
    if (r === 'granted') await syncPush();
    toast(r === 'granted' ? '通知をオンにしました' : '通知はオフのままです');
    renderMe();
  };
}

function fmtDate(ts){
  if (!ts?.toDate) return '';
  const d = ts.toDate();
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function renderInbox(){
  renderMe();
  const list = $('#inbox-list');
  if (!FB_ON || !me) { list.innerHTML = ''; return; }
  if (!inbox.length) { list.innerHTML = `<div class="empty">まだ絵は届いていません 🎨</div>`; return; }
  list.innerHTML = inbox.map(x => `
    <div class="item" data-id="${esc(x.id)}">
      <img src="${esc(x.image)}" alt="${esc(x.fromName)}さんからの絵" loading="lazy">
      <div class="meta">
        <div class="from">${esc(x.fromName)} さんから${x.read ? '' : '<span class="new">NEW</span>'}</div>
        ${x.message ? `<div class="msg">${esc(x.message)}</div>` : ''}
        <div class="when">${fmtDate(x.createdAt)}</div>
      </div>
      <div class="acts">
        <button data-act="save">保存</button>
        <button data-act="reply">返事をかく</button>
        <button data-act="over">✏️ 描き足して返す</button>
        <button data-act="del">削除</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('.item').forEach(el => {
    const x = inbox.find(i => i.id === el.dataset.id);
    const ref = db.collection('users').doc(me.uid).collection('inbox').doc(x.id);
    el.querySelector('[data-act=save]').onclick = async () => {
      const blob = await (await fetch(x.image)).blob();
      downloadBlob(blob, `from_${x.fromName}.jpg`);
    };
    el.querySelector('[data-act=reply]').onclick = () => {
      store.set('oekaki-last-to', x.fromName);
      show('draw'); toast(`${x.fromName} さんへの返事をかこう`);
    };
    el.querySelector('[data-act=over]').onclick = () => {
      if (!isEmpty() && !confirm('いま描いている絵は消えます。いいですか？')) return;
      ops = []; redo = [];
      redraw(); setBase(x.image);
      store.set('oekaki-last-to', x.fromName);
      show('draw'); toast(`${x.fromName} さんの絵に描き足そう`);
    };
    el.querySelector('[data-act=del]').onclick = async () => {
      if (confirm('この絵を削除しますか？')) await ref.delete().catch(console.error);
    };
  });
  // 開いたら既読に
  inbox.filter(x => !x.read).forEach(x =>
    db.collection('users').doc(me.uid).collection('inbox').doc(x.id).update({ read:true }).catch(() => {}));
}
renderMe();

if (location.hash === '#inbox') show('inbox');

/* ── PWA ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
